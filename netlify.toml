[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"

# Protokolle (PDF) nicht von Suchmaschinen indexieren lassen
[[headers]]
  for = "/uploads/protokoll*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/uploads/Protokoll*"
  [headers.values]
    X-Robots-Tag = "noindex"
