# Login über GitHub; Netlify übernimmt die Anmeldung (OAuth).
# Wer Inhalte bearbeiten will, braucht ein GitHub-Konto mit Schreibrecht auf das Repository.
backend:
  name: github
  repo: michaelbaehler/elternrat-laubegg
  branch: main
  base_url: https://api.netlify.com
  site_domain: elternratlaubegg.netlify.app
  commit_messages:
    create: "Neu: {{collection}} „{{slug}}“ (via CMS)"
    update: "Geändert: {{collection}} „{{slug}}“ (via CMS)"
    delete: "Gelöscht: {{collection}} „{{slug}}“ (via CMS)"
    uploadMedia: "Datei hochgeladen: {{path}} (via CMS)"
    deleteMedia: "Datei gelöscht: {{path}} (via CMS)"

# Lokales Backend für Entwicklung (auskommentieren für Produktion)
# local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

locale: de
slug:
  encoding: "ascii"
  clean_accents: true
logo_url: /brand/erl-kreis-dunkel.svg
site_url: https://elternratlaubegg.netlify.app
display_url: https://elternratlaubegg.netlify.app

collections:
  # ─── Helfereinsätze ───────────────────────────────────────────────────────
  - name: "helfereinsaetze"
    label: "Helfereinsätze"
    label_singular: "Helfereinsatz"
    description: "Für die Anmeldung ein Google Formular erstellen und den Link hier eintragen. Ausgeschaltete Einsätze («Aktiv» aus) sind auf der Website unsichtbar."
    folder: "src/content/helfereinsaetze"
    summary: "{{date}} · {{title}}"
    sortable_fields: ["date", "title"]
    create: true
    slug: "{{slug}}"
    extension: "md"
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Datum", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false }
      - { label: "Zeit (z. B. 07:30–09:00 Uhr)", name: "time", widget: "string", required: false }
      - { label: "Ort", name: "location", widget: "string" }
      - { label: "Kurzbeschreibung", name: "description", widget: "text" }
      - { label: "Link zum Google Formular", name: "formUrl", widget: "string", required: false, hint: "In Google Forms: Senden → Link-Symbol → Link kopieren. Die lange Adresse (docs.google.com/forms/…) wird direkt in die Seite eingebettet, die kurze (forms.gle/…) als Knopf verlinkt. Leer lassen = «Anmeldung folgt»." }
      - { label: "Anzahl gesuchte Personen", name: "spotsTotal", widget: "number", value_type: "int", min: 1, required: false, hint: "Optional. Leer lassen, wenn die Plätze nicht gezählt werden sollen." }
      - { label: "Bereits angemeldet", name: "spotsTaken", widget: "number", value_type: "int", min: 0, default: 0, required: false, hint: "Optional. Von Hand nachführen (Antworten im Google Formular)." }
      - { label: "Anmeldeschluss", name: "deadline", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false, required: false }
      - { label: "Aktiv (sichtbar)", name: "active", widget: "boolean", default: true, hint: "Ausschalten statt löschen, um einen Einsatz auszublenden" }
      - label: "Themengruppe"
        name: "thema"
        widget: "select"
        required: false
        options: ["Schlittschuhverleih", "Events", "Elternbildung", "Raus Laus", "Sicherheit", "Sonstiges"]
      - { label: "Details (Markdown)", name: "body", widget: "markdown", required: false }

  # ─── Termine ──────────────────────────────────────────────────────────────
  - name: "termine"
    label: "Termine"
    label_singular: "Termin"
    description: "Termine aus dem Google Sheet «Kalender» erscheinen automatisch auf der Website. Hier nur Termine erfassen, die nicht im Sheet stehen."
    folder: "src/content/termine"
    summary: "{{date}} · {{title}}"
    sortable_fields: ["date", "title"]
    create: true
    slug: "{{slug}}"
    extension: "md"
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Datum", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false }
      - { label: "Uhrzeit", name: "time", widget: "string", required: false }
      - { label: "Ort", name: "location", widget: "string", required: false }
      - label: "Kategorie"
        name: "category"
        widget: "select"
        options: ["Sitzung", "Event", "Schlittschuhverleih", "Raus Laus", "Elternbildung", "Sicherheit", "Sonstiges"]
      - { label: "Öffentlich", name: "public", widget: "boolean", default: true }

  # ─── Sitzungen ────────────────────────────────────────────────────────────
  - name: "sitzungen"
    label: "Sitzungen"
    label_singular: "Sitzung"
    folder: "src/content/sitzungen"
    summary: "{{date}} · {{title}}"
    sortable_fields: ["date", "title"]
    create: true
    slug: "{{slug}}"
    extension: "md"
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Datum", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false }
      - { label: "Schuljahr (z.B. 2025/2026)", name: "schuljahr", widget: "string" }
      - { label: "Protokoll", name: "protokollUrl", widget: "file", required: false, hint: "PDF hochladen, bereits hochgeladene Datei wählen oder Link einfügen (z. B. Google Doc)" }
      - { label: "Präsentation (PDF)", name: "praesentationUrl", widget: "file", required: false }
      - { label: "Protokoll mit Passwort geschützt", name: "passwort", widget: "boolean", default: false }
