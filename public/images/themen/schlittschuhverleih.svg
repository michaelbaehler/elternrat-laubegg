<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="220" fill="#FFF8F0"/>
  <!-- Subtle ice surface at bottom -->
  <rect x="0" y="185" width="400" height="35" fill="#EAF6FB"/>
  <line x1="0" y1="185" x2="400" y2="185" stroke="#C9E8F5" stroke-width="1.5"/>
  <!-- Ice reflections -->
  <ellipse cx="195" cy="188" rx="65" ry="5" fill="#D0EEF8" opacity="0.7"/>

  <!-- === ICE SKATE === -->
  <!-- Boot shaft (upper tall part) -->
  <path d="M162 55 Q162 44 172 44 L200 44 Q210 44 210 55 L210 138 L162 138 Z" fill="#FFAA44"/>
  <!-- Boot toe box (front, lower) -->
  <path d="M210 120 L240 148 Q244 155 237 158 L152 158 Q145 158 145 151 L145 143 L162 138 L210 138 Z" fill="#FFAA44"/>
  <!-- Depth / shadow on toe -->
  <path d="M210 130 L240 148 Q244 155 237 158 L210 158 Z" fill="#E8952A"/>
  <!-- Heel depth -->
  <path d="M145 143 L145 158 L162 158 L162 143 Z" fill="#E8952A"/>
  <!-- Boot tongue -->
  <path d="M174 44 Q183 32 192 44" fill="#FFC870"/>
  <!-- Laces -->
  <line x1="169" y1="68" x2="203" y2="68" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="169" y1="82" x2="203" y2="82" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="169" y1="96" x2="203" y2="96" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="169" y1="110" x2="203" y2="110" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="169" y1="124" x2="203" y2="124" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Blade holder (dark strip) -->
  <rect x="143" y="157" width="98" height="9" rx="3" fill="#555"/>
  <!-- Blade (extends past both ends) -->
  <rect x="132" y="164" width="122" height="4" rx="2" fill="#AACCD8"/>

  <!-- CHF 20 badge -->
  <rect x="270" y="60" width="80" height="36" rx="18" fill="#FFAA44"/>
  <text x="310" y="83" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="800" fill="white">CHF 20</text>

  <!-- Snowflake 1 -->
  <g transform="translate(62,78)" opacity="0.55">
    <line x1="0" y1="-16" x2="0" y2="16" stroke="#FFAA44" stroke-width="2" stroke-linecap="round"/>
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#FFAA44" stroke-width="2" stroke-linecap="round"/>
    <line x1="-11" y1="-11" x2="11" y2="11" stroke="#FFAA44" stroke-width="2" stroke-linecap="round"/>
    <line x1="11" y1="-11" x2="-11" y2="11" stroke="#FFAA44" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="3.5" fill="#FFAA44"/>
  </g>
  <!-- Snowflake 2 -->
  <g transform="translate(338,110)" opacity="0.4">
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#FFAA44" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#FFAA44" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="-8" y1="-8" x2="8" y2="8" stroke="#FFAA44" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="8" y1="-8" x2="-8" y2="8" stroke="#FFAA44" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2.5" fill="#FFAA44"/>
  </g>
  <!-- Snowflake 3 (small) -->
  <g transform="translate(310,52)" opacity="0.3">
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#FFAA44" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#FFAA44" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-6" y1="-6" x2="6" y2="6" stroke="#FFAA44" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="6" y1="-6" x2="-6" y2="6" stroke="#FFAA44" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Dot accents -->
  <circle cx="55" cy="145" r="4" fill="#FFAA44" opacity="0.25"/>
  <circle cx="355" cy="65" r="5" fill="#FFAA44" opacity="0.2"/>
  <circle cx="340" cy="168" r="3" fill="#FFAA44" opacity="0.2"/>
</svg>
