<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="220" fill="#FFF8F0"/>

  <!-- Large magnifying glass -->
  <!-- Glass shadow/glow -->
  <circle cx="185" cy="102" r="68" fill="#FFAA44" opacity="0.08"/>
  <!-- Lens outer ring -->
  <circle cx="185" cy="102" r="60" fill="none" stroke="#FFAA44" stroke-width="12"/>
  <!-- Lens inner (glass) -->
  <circle cx="185" cy="102" r="48" fill="white"/>
  <!-- Lens tint -->
  <circle cx="185" cy="102" r="48" fill="#EAF6FB" opacity="0.6"/>
  <!-- Lens shine/highlight -->
  <circle cx="170" cy="86" r="12" fill="white" opacity="0.55"/>
  <circle cx="180" cy="80" r="5" fill="white" opacity="0.4"/>

  <!-- Content inside magnifying glass: grid / fine structure -->
  <g clip-path="url(#lens-clip)">
    <!-- Horizontal lines -->
    <line x1="137" y1="88" x2="233" y2="88" stroke="#E8D0C0" stroke-width="1"/>
    <line x1="137" y1="100" x2="233" y2="100" stroke="#E8D0C0" stroke-width="1"/>
    <line x1="137" y1="112" x2="233" y2="112" stroke="#E8D0C0" stroke-width="1"/>
    <!-- Vertical lines -->
    <line x1="162" y1="60" x2="162" y2="144" stroke="#E8D0C0" stroke-width="1"/>
    <line x1="186" y1="60" x2="186" y2="144" stroke="#E8D0C0" stroke-width="1"/>
    <line x1="210" y1="60" x2="210" y2="144" stroke="#E8D0C0" stroke-width="1"/>
    <!-- Small orange dot (what's being found) -->
    <circle cx="186" cy="100" r="7" fill="#FFAA44"/>
    <circle cx="186" cy="100" r="4" fill="#E8952A"/>
    <circle cx="184" cy="98" r="1.5" fill="white" opacity="0.6"/>
  </g>
  <clipPath id="lens-clip">
    <circle cx="185" cy="102" r="48"/>
  </clipPath>

  <!-- Handle -->
  <rect x="227" y="143" width="18" height="62" rx="9" fill="#FFAA44" transform="rotate(38 236 172)"/>
  <!-- Handle end cap -->
  <circle cx="272" cy="188" r="10" fill="#E8952A"/>

  <!-- Checkmark badge (result found!) -->
  <circle cx="310" cy="68" r="22" fill="#FFAA44"/>
  <path d="M299 68 L307 77 L323 58" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Small decorative dots -->
  <circle cx="55" cy="60" r="6" fill="#FFAA44" opacity="0.18"/>
  <circle cx="68" cy="78" r="3.5" fill="#FFAA44" opacity="0.12"/>
  <circle cx="345" cy="160" r="5" fill="#FFAA44" opacity="0.15"/>
  <circle cx="65" cy="165" r="4" fill="#FFC870" opacity="0.2"/>
  <circle cx="355" cy="55" r="3" fill="#FFAA44" opacity="0.12"/>
</svg>
